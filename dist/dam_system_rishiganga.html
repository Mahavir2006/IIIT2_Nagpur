<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAM SYSTEM: Rishiganga natural dam breach, 3D prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* DAM SYSTEM prototype: design tokens, layout and components.
   Light and dark themes via prefers-color-scheme or data-theme on <html>. */
:root{
  --panel: rgba(247,249,250,.90); --panel-2: rgba(232,238,241,.92); --ink:#13222b; --ink-2:#4b616c; --ink-3:#7b8f99; --line:rgba(19,34,43,.14);
  --ice:#1b7fa1; --silt:#8a5b2f; --amber:#a86a00; --alert:#b8321f; --safe:#2f7d55; --chip:rgba(19,34,43,.06); --shadow:0 18px 50px rgba(19,34,43,.18); --on-ink:#f4f7f8;
  --ui:"Archivo", "Helvetica Neue", Arial, sans-serif; --read:"Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel: rgba(17,28,36,.84); --panel-2: rgba(26,40,50,.9); --ink:#e7eef1; --ink-2:#a3b6bf; --ink-3:#71858f; --line:rgba(200,222,232,.14);
    --ice:#8fd3e8; --silt:#d1a06f; --amber:#e8b04a; --alert:#f06a52; --safe:#79c99a; --chip:rgba(200,222,232,.08); --shadow:0 18px 50px rgba(0,0,0,.45); --on-ink:#10202a;
  }
}
:root[data-theme="dark"]{
  --panel: rgba(17,28,36,.84); --panel-2: rgba(26,40,50,.9); --ink:#e7eef1; --ink-2:#a3b6bf; --ink-3:#71858f; --line:rgba(200,222,232,.14);
  --ice:#8fd3e8; --silt:#d1a06f; --amber:#e8b04a; --alert:#f06a52; --safe:#79c99a; --chip:rgba(200,222,232,.08); --shadow:0 18px 50px rgba(0,0,0,.45); --on-ink:#10202a;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; overflow:hidden; background:#aabfcb; color:var(--ink); font-family:var(--ui); font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; width:100%; height:100%; outline:none; }
button, select, input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--ice); outline-offset:2px; }

/* top bar */
.top{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px; right:16px; display:flex; align-items:flex-start; gap:14px; pointer-events:none; z-index:5; }
.top > *{ pointer-events:auto; }
.brand{ background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:10px 16px 11px; box-shadow:var(--shadow); }
.brand b{ display:block; font-weight:800; font-stretch:125%; letter-spacing:.04em; font-size:17px; line-height:1.1; }
.brand span{ display:block; color:var(--ink-2); font-size:12.5px; margin-top:2px; }
.clock{ margin-left:auto; display:flex; align-items:center; gap:10px; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:8px 10px 8px 16px; box-shadow:var(--shadow); }
.clock .t{ font-stretch:88%; font-weight:700; font-size:24px; letter-spacing:.01em; min-width:128px; }
.clock .st{ color:var(--ink-2); font-size:12px; line-height:1.25; min-width:120px; }
.btn{ border:1px solid var(--line); background:var(--chip); border-radius:9px; padding:7px 12px; font-weight:600; font-size:13px; }
.btn:hover{ border-color:var(--ink-3); }
.btn.primary{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.btn[aria-pressed="true"]{ border-color:var(--ice); box-shadow:inset 0 0 0 1px var(--ice); }
.btn.hot{ background:var(--alert); border-color:var(--alert); color:#fff; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.seg button{ border:0; background:transparent; padding:6px 10px; font-size:12.5px; font-weight:600; color:var(--ink-2); }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--on-ink); }

/* story panel */
.story{ position:fixed; left:16px; top:calc(env(safe-area-inset-top,0px) + 92px); bottom:calc(env(safe-area-inset-bottom,0px) + 86px); width:392px; background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; z-index:4; }
.story .scroll{ overflow:auto; padding:18px 20px 20px; flex:1; overscroll-behavior:contain; }
.chno{ display:flex; align-items:baseline; gap:10px; color:var(--ink-3); font-size:12.5px; }
.chno strong{ font-stretch:125%; font-weight:800; font-size:30px; color:var(--ice); line-height:1; }
.story h1{ font-family:var(--read); font-weight:500; font-size:27px; line-height:1.12; margin:10px 0 12px; letter-spacing:-.005em; }
.story p{ font-family:var(--read); font-size:16px; line-height:1.55; margin:0 0 12px; color:var(--ink); }
.story p.small, .note{ font-family:var(--ui); font-size:12.5px; line-height:1.45; color:var(--ink-2); }
.note{ border-left:2px solid var(--line); padding:2px 0 2px 10px; margin:12px 0; }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px; }
.story .foot{ border-top:1px solid var(--line); padding:10px 14px; display:flex; justify-content:space-between; gap:8px; }
.kv{ display:grid; grid-template-columns:1fr auto; gap:6px 12px; margin:10px 0 12px; font-size:13px; }
.kv dt{ color:var(--ink-2); }
.kv dd{ margin:0; font-weight:650; text-align:right; }
.card-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
.scard{ text-align:left; border:1px solid var(--line); background:var(--chip); border-radius:10px; padding:10px 11px; font-size:12.5px; line-height:1.35; }
.scard b{ display:block; font-size:14px; margin-bottom:3px; }
.scard .m{ color:var(--ink-2); }
.scard[aria-pressed="true"]{ border-color:var(--ice); box-shadow:inset 0 0 0 1px var(--ice); }
table.t{ width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0 12px; }
table.t th{ text-align:left; font-weight:600; color:var(--ink-2); padding:5px 4px; border-bottom:1px solid var(--line); }
table.t td{ padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
table.t td.r, table.t th.r{ text-align:right; }
.tag{ display:inline-block; font-size:11.5px; font-weight:650; padding:1px 7px; border-radius:20px; }
.tag.hit{ background:color-mix(in srgb, var(--alert) 18%, transparent); color:var(--alert); }
.tag.warn{ background:color-mix(in srgb, var(--amber) 20%, transparent); color:var(--amber); }
.tag.ok{ background:color-mix(in srgb, var(--safe) 18%, transparent); color:var(--safe); }
.bars .row{ display:grid; grid-template-columns:150px 1fr 44px; gap:8px; align-items:center; font-size:12.5px; margin:5px 0; }
.bars .track{ position:relative; height:10px; background:var(--chip); border-radius:6px; overflow:hidden; }
.bars .fill{ position:absolute; top:0; bottom:0; border-radius:6px; }
.bars .v{ text-align:right; font-weight:650; }
.score{ display:flex; align-items:center; gap:14px; margin:6px 0 10px; }
.score .big{ font-stretch:110%; font-weight:800; font-size:52px; line-height:1; }
.score .band{ font-size:13px; color:var(--ink-2); }
canvas.ch{ width:100%; height:150px; display:block; margin:8px 0 6px; }
pre.cap{ font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:11px; line-height:1.4; background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:230px; white-space:pre; }
.msg{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; font-size:13.5px; }
.msg .lang{ font-size:11.5px; color:var(--ink-3); margin-bottom:3px; }
.msg[lang="hi"]{ font-size:15px; line-height:1.6; }
input[type=range]{ width:100%; accent-color:var(--ice); }
.progress{ height:6px; background:var(--chip); border-radius:6px; overflow:hidden; margin:8px 0; }
.progress i{ display:block; height:100%; width:0; background:var(--ice); }

/* intel panel */
.intel{ position:fixed; right:16px; top:calc(env(safe-area-inset-top,0px) + 92px); width:318px; max-height:calc(100% - 190px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overflow:auto; background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px 12px; z-index:4; }
.intel h2{ font-size:13px; font-weight:700; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
.intel h2 small{ font-weight:500; color:var(--ink-3); }
.intel .kv{ margin:6px 0 8px; font-size:12.5px; }
.intel .sep{ border-top:1px solid var(--line); margin:10px 0; }
.legend{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-2); }
.legend .bar{ flex:1; height:8px; border-radius:4px; }
.swatches{ display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-top:6px; }
.swatches i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

/* chapter rail */
.rail{ position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; gap:6px; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:var(--shadow); z-index:5; overflow-x:auto; }
.rail button{ flex:1 0 auto; border:0; background:transparent; border-radius:8px; padding:7px 10px; display:flex; gap:7px; align-items:baseline; font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap; }
.rail button span{ font-stretch:120%; font-weight:800; color:var(--ink-3); }
.rail button[aria-current="step"]{ background:var(--ink); color:var(--on-ink); }
.rail button[aria-current="step"] span{ color:inherit; opacity:.7; }
.rail button.done span{ color:var(--ice); }

/* labels in 3D */
#labels{ position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
.lab{ position:absolute; left:0; top:0; transform:translate(-9999px,-9999px); display:flex; align-items:flex-end; gap:0; will-change:transform; }
.lab .stem{ width:1px; height:26px; background:rgba(255,255,255,.85); box-shadow:0 0 2px rgba(0,0,0,.5); }
.lab .dot{ position:absolute; left:-4px; bottom:-4px; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.35); }
.lab .box{ margin-left:-1px; margin-bottom:22px; background:rgba(12,22,28,.78); color:#eef4f6; border-radius:7px; padding:4px 8px 5px; font-size:12px; line-height:1.25; white-space:nowrap; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-left:3px solid #cfd8dc; }
.lab .box b{ font-weight:650; display:block; }
.lab .box small{ color:#b9c8ce; font-size:11px; }
.lab.hit .box{ border-left-color:#f06a52; } .lab.hit .dot{ background:#f06a52; }
.lab.warn .box{ border-left-color:#e8b04a; } .lab.warn .dot{ background:#e8b04a; }
.lab.ok .box{ border-left-color:#79c99a; } .lab.ok .dot{ background:#79c99a; }
.lab.front .box{ border-left-color:#8fd3e8; background:rgba(12,40,52,.82); }
.lab.dim{ opacity:.55; }

.loader{ position:fixed; inset:0; display:grid; place-items:center; z-index:10; background:radial-gradient(ellipse at 50% 40%, #dfe8ed, #9eb4c0); color:#13222b; transition:opacity .6s; }
.loader div{ text-align:center; }
.loader b{ display:block; font-weight:800; font-stretch:125%; letter-spacing:.04em; font-size:22px; }
.loader span{ color:#4b616c; font-size:13px; }
.toggle-intel{ display:none; }
.hint{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 74px); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:12.5px; color:var(--ink-2); z-index:4; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; }

@media (max-width: 1180px){ .intel{ width:280px; } .story{ width:350px; } }
@media (max-width: 900px){
  .story{ top:auto; left:8px; right:8px; width:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 66px); max-height:46%; }
  .intel{ display:none; left:8px; right:8px; width:auto; top:calc(env(safe-area-inset-top,0px) + 76px); max-height:40%; }
  .intel.open{ display:block; }
  .toggle-intel{ display:inline-block; }
  .top{ left:8px; right:8px; flex-wrap:wrap; gap:8px; }
  .brand{ padding:8px 12px; } .brand span{ display:none; }
  .clock{ width:100%; margin-left:0; gap:6px; padding:6px 8px 6px 12px; } .clock .btn{ padding:6px 9px; white-space:nowrap; font-size:12.5px; } .clock .t{ font-size:17px; min-width:0; margin-right:auto; } .clock .st{ display:none; }
  .rail{ left:8px; right:8px; }
  .rail button b{ display:none; }
  .hint{ display:none; }
  .story h1{ font-size:23px; }
}
@media (prefers-reduced-motion: reduce){ .loader{ transition:none; } }

/* 2D map views: a flat canvas layer plus its own floating map chrome */
.map2d-stage, .basin2d-stage{ background:#aabfcb; }
.m2d-canvas, .b2d-canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
.m2d-canvas:active, .b2d-canvas:active{ cursor:grabbing; }
.m2d-chrome, .b2d-chrome{ position:absolute; inset:0; pointer-events:none; font-family:var(--ui); }
.m2d-chrome > *, .b2d-chrome > *{ pointer-events:auto; }
/* The story panel owns the left 408px and the intel panel the right ~350px, so
   the maps' own controls live in the clear middle band between them, and the
   readouts along the bottom edge above the chapter rail. */
.m2d-head, .b2d-head{ position:absolute; left:424px; top:92px; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:8px 14px; box-shadow:var(--shadow); }
.m2d-head b, .b2d-head b{ display:block; font-weight:800; font-stretch:125%; letter-spacing:.04em; font-size:14px; }
.m2d-head span, .b2d-head span{ color:var(--ink-2); font-size:12px; }
.m2d-bar{ position:absolute; left:424px; top:158px; display:flex; flex-wrap:wrap; gap:6px; max-width:520px; }
.b2d-bar{ position:absolute; left:424px; top:158px; display:flex; flex-wrap:wrap; gap:6px; max-width:520px; }
.m2d-l, .b2d-l{ border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:8px; padding:5px 10px; font-weight:600; font-size:12.5px; box-shadow:var(--shadow); }
.m2d-l:hover, .b2d-l:hover{ border-color:var(--ink-3); }
.m2d-l[aria-pressed="true"]{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.m2d-chk{ position:absolute; left:424px; top:206px; display:flex; gap:7px; align-items:center; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:8px; padding:5px 11px; font-size:12.5px; color:var(--ink-2); box-shadow:var(--shadow); }
.m2d-zoom, .b2d-zoom{ position:absolute; left:424px; top:250px; flex-direction:row; display:flex; gap:6px; }
.m2d-z, .b2d-z{ width:34px; height:34px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(14px); border-radius:9px; font-size:16px; font-weight:700; line-height:1; box-shadow:var(--shadow); }
.m2d-z:hover, .b2d-z:hover{ border-color:var(--ink-3); }
/* Bottom strip, stacked upward from the chapter rail so the blocks never
   overlap: legend, then the scale bar above it, then the note above that. */
.m2d-legend{ position:absolute; left:424px; bottom:96px; max-width:520px; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:11.5px; color:var(--ink-2); display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); }
.m2d-ramp{ flex:1; height:8px; border-radius:4px; }
.b2d-legend{ position:absolute; left:424px; bottom:96px; max-width:300px; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:11.5px; color:var(--ink-2); display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; box-shadow:var(--shadow); }
.b2d-legend-row{ display:flex; gap:6px; align-items:center; }
.b2d-legend-row i{ width:10px; height:10px; border-radius:2px; flex:0 0 auto; }
.m2d-scale{ position:absolute; left:424px; bottom:144px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; color:var(--ink-2); font-size:11.5px; }
.b2d-scale{ position:absolute; left:424px; bottom:212px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; color:var(--ink-2); font-size:11.5px; }
.m2d-scale i, .b2d-scale i{ display:block; height:6px; border:1px solid var(--ink-3); border-top:0; background:rgba(255,255,255,.25); }
.m2d-tip, .b2d-tip{ position:absolute; right:16px; bottom:96px; max-width:250px; background:var(--panel); backdrop-filter:blur(16px); border:1px solid var(--line); border-left:3px solid var(--ice); border-radius:10px; padding:8px 11px; font-size:12px; line-height:1.4; color:var(--ink-2); box-shadow:var(--shadow); }
.m2d-tip b, .b2d-tip b{ color:var(--ink); }
.m2d-note{ position:absolute; left:424px; bottom:184px; max-width:520px; font-size:11.5px; color:var(--ink-2); background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:10px; padding:7px 11px; box-shadow:var(--shadow); }
@media (max-width: 900px){
  .m2d-head, .b2d-head{ left:8px; top:76px; }
  .m2d-bar, .b2d-bar{ left:8px; top:132px; max-width:70%; }
  .m2d-chk{ left:8px; top:176px; }
  .m2d-zoom, .b2d-zoom{ left:8px; top:216px; }
  .m2d-note{ display:none; }
  .m2d-legend, .b2d-legend{ left:8px; right:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 78px); max-width:80%; }
  .m2d-scale, .b2d-scale{ left:8px; bottom:calc(env(safe-area-inset-bottom,0px) + 122px); }
  .m2d-tip, .b2d-tip{ right:8px; left:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 78px); max-width:44%; }
}
/* Below ~1180px the side panels narrow; keep the map controls clear of them. */
@media (max-width: 1180px) and (min-width: 901px){
  .m2d-head, .b2d-head, .m2d-bar, .b2d-bar, .m2d-chk, .m2d-zoom, .b2d-zoom,
  .m2d-legend, .b2d-legend, .m2d-scale, .b2d-scale, .m2d-note{ left:382px; }
  .m2d-legend, .b2d-legend, .m2d-scale, .b2d-scale, .m2d-note{ max-width:340px; }
}

/* Ganga Basin View Overlay & Component Styles */
.basin-stage canvas{ display:block; width:100%; height:100%; }
.basin-top-bar{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; z-index:6; pointer-events:none; }
.basin-top-bar > *{ pointer-events:auto; }
.breadcrumb{ display:flex; align-items:center; gap:6px; background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:8px 14px; box-shadow:var(--shadow); }
.bc-item{ border:0; background:transparent; font-weight:600; font-size:13px; color:var(--ink-2); padding:2px 4px; }
.bc-item.active{ color:var(--ice); font-weight:700; }
.bc-sep{ color:var(--ink-3); font-size:13px; }
.basin-controls{ display:flex; gap:8px; align-items:center; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:12px; padding:6px 10px; box-shadow:var(--shadow); }
.basin-controls select, .basin-controls .btn{ background:var(--chip); color:var(--ink); border:1px solid var(--line); font-weight:600; border-radius:8px; padding:6px 10px; font-size:12.5px; }
.basin-controls select option{ background:var(--panel); color:var(--ink); }
.scen-disclaimer{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 68px); left:50%; transform:translateX(-50%); background:rgba(184,50,31,0.92); color:#fff; padding:6px 14px; border-radius:8px; font-size:12.5px; z-index:6; box-shadow:var(--shadow); }

<script>
/* DAM SYSTEM Basin Core: Pure JS 1D Muskingum-Cunge routing, HAND inundation mapping,
   reservoir level-pool routing, town impact scoring and mass conservation ledger.
   Runs in Node and the browser without DOM or three.js dependencies. */
(function (root) {
  'use strict';

  let RIVERS = null;
  let TOWNS = [];
  let STRUCTURES = [];
  let SECTIONS = {};
  let BASEFLOW = {};

  const ST = {
    scen: 'A',
    season: 'february_lean',
    tMaxSec: 86400 * 5, // 5 days routing
    dtSec: 300,        // 5 min routing steps
    currentTime: 0,
    reaches: {},
    towns: {},
    structures: {},
    inflowTotal_m3: 0,
    outflowTotal_m3: 0,
    storageTotal_m3: 0,
    massBalanceErr: 0,
    isComplete: false
  };

  function init(riversData, townsData, structuresData, sectionsData, baseflowData) {
    RIVERS = riversData;
    TOWNS = townsData;
    STRUCTURES = structuresData;
    SECTIONS = sectionsData;
    BASEFLOW = baseflowData;
    resetState();
  }

  function resetState() {
    ST.currentTime = 0;
    ST.reaches = {};
    ST.towns = {};
    ST.structures = {};
    ST.inflowTotal_m3 = 0;
    ST.outflowTotal_m3 = 0;
    ST.storageTotal_m3 = 0;
    ST.massBalanceErr = 0;
    ST.isComplete = false;

    if (!RIVERS || !RIVERS.reaches) return;

    // Initialize reach states
    RIVERS.reaches.forEach(r => {
      ST.reaches[r.id] = {
        id: r.id,
        name: r.name,
        length_km: r.length_km,
        slope: r.slope,
        width_m: r.width_m,
        up: r.up,
        down: r.down,
        polyline: r.polyline,
        baseflow: 50,
        Q: [],
        stage: [],
        timeSec: [],
        peakQ: 0,
        peakStage: 0,
        tPeakSec: 0,
        tArrivalSec: -1,
        lastIn: undefined
      };
    });

    // Initialize town states
    TOWNS.forEach(t => {
      ST.towns[t.id] = {
        id: t.id,
        name: t.name,
        lat: t.lat,
        lon: t.lon,
        pop: t.pop,
        reach: t.reach,
        chainage_km: t.chainage_km,
        bank_e_m: t.bank_e_m,
        cwc_warn_m: t.cwc_warn_m,
        cwc_danger_m: t.cwc_danger_m,
        vulnerability: t.vulnerability,
        tArrivalSec: -1,
        peakStage: 0,
        peakDepth: 0,
        peakQ: 0,
        hazardClass: 'H0',
        exposedPop: 0,
        riskScore: 0,
        stageHistory: [],
        qHistory: []
      };
    });

    // Initialize structure states
    STRUCTURES.forEach(s => {
      ST.structures[s.id] = {
        id: s.id,
        name: s.name,
        type: s.type,
        reach: s.reach,
        height_m: s.height_m,
        storage_Mm3: s.storage_Mm3,
        spillway_m3s: s.spillway_m3s,
        currentStorage_Mm3: s.storage_Mm3 * 0.7,
        isOvertopped: false,
        peakInflow: 0,
        peakOutflow: 0
      };
    });
  }

  function getRating(reachId, h) {
    const sec = SECTIONS[reachId];
    if (!sec || !sec.length) {
      const r = ST.reaches[reachId] || { width_m: 100, slope: 0.001 };
      const A = r.width_m * h;
      const Q = (1.0 / 0.035) * A * Math.pow(Math.max(0.1, h), 2/3) * Math.sqrt(r.slope);
      return { h, A, W: r.width_m, Q };
    }
    const idx = Math.min(sec.length - 1, Math.max(0, Math.floor(h * 2)));
    return sec[idx];
  }

  function stageFromQ(reachId, q) {
    const sec = SECTIONS[reachId];
    if (!sec || !sec.length) return Math.max(0, q / 300);
    for (let i = 0; i < sec.length; i++) {
      if (sec[i].Q >= q) return sec[i].h;
    }
    const last = sec[sec.length - 1];
    return last.h + (q - last.Q) / (last.W * 5.0);
  }

  // Kinematic wave celerity from the reach's own Manning rating curve: c = (5/3)*V,
  // V = Q/A at the stage carrying the given discharge. This replaces a flat
  // `3.5 * slope^0.25` guess that gave rishiganga_1 (slope 0.045) a celerity of
  // about 1.6 m/s - roughly 15x slower than the ~16-25 m/s front speeds Shugar et
  // al. (2021) measured for this exact 2021 event. The rating-curve version gives
  // rishiganga_1 about 26 m/s at flood discharge, matching that field data, and it
  // varies with the actual flow instead of being a constant per reach.
  function celerityFor(reachId, q) {
    const h = stageFromQ(reachId, q);
    const row = getRating(reachId, h);
    const V = row && row.A > 0.01 ? row.Q / row.A : 1.0;
    return Math.min(30, Math.max(0.5, (5 / 3) * V));
  }

  function runRouting(scenId, baseflowSeason, externalInflow) {
    ST.scen = scenId || 'A';
    ST.season = baseflowSeason || 'february_lean';
    resetState();

    const bfMap = BASEFLOW[ST.season] || BASEFLOW['february_lean'];
    const dt = ST.dtSec;
    const nSteps = Math.floor(ST.tMaxSec / dt);

    // Set baseflows per reach
    RIVERS.reaches.forEach(r => {
      ST.reaches[r.id].baseflow = bfMap[r.id] || 50;
    });

    // Inflow Hydrograph Setup
    // Inflow Hydrograph Setup
    let breachInflow = [];
    if (ST.scen === 'A') {
      if (externalInflow && externalInflow.Q && externalInflow.Q.length) {
        breachInflow = externalInflow.Q;
      } else if (typeof root !== 'undefined' && root.DamCore) {
        try {
          const activeScen = root.DamCore.SCEN ? root.DamCore.SCEN[root.DamCore.P ? root.DamCore.P.scen : 'large'] : null;
          const hg = activeScen ? root.DamCore.hydrograph(activeScen, 2, 5400) : root.DamCore.hydrograph(root.DamCore.SCEN.large, 2, 5400);
          if (hg && hg.Q && hg.Q.length) {
            breachInflow = hg.Q;
            // DamCore.hydrograph() returns {dt, Q, V0} with no time array, so build
            // one from its own fixed step (hg.dt, here 2s) — without it, gt.length
            // is 0 below and we silently fall through to the unaveraged, aliasing
            // idx=floor(tSec/300) path (see the averaging comment further down).
            const gt = hg.Q.map((_, i) => i * (hg.dt || 2));
            externalInflow = { gt, Q: hg.Q };
          }
        } catch (e) {}
      }
    } else if (ST.scen === 'B') {
      // 2021 Hindcast synthetic hydrograph
      for (let t = 0; t <= ST.tMaxSec; t += dt) {
        if (t < 5400) breachInflow.push(14200 * Math.exp(-t / 1800));
        else breachInflow.push(0);
      }
    } else if (ST.scen === 'C') {
      // Tehri Dam Failure hydrograph (Froehlich parameters)
      for (let t = 0; t <= ST.tMaxSec; t += dt) {
        if (t < 3600) breachInflow.push(65000 * Math.sin(Math.PI * t / 7200));
        else if (t < 14400) breachInflow.push(65000 * Math.exp(-(t - 3600) / 3600));
        else breachInflow.push(0);
      }
    }

    // Step-by-step Muskingum-Cunge 1D Routing
    let accumInflow_m3 = 0;
    let accumOutflow_m3 = 0;

    // Reach graph: `up`/`down` in rivers.json are confluence/place NODE names
    // (e.g. "vishnuprayag"), not reach ids. The per-reach inflow code below used
    // to test `ST.reaches[r.up]` directly, i.e. look up a reach keyed by a node
    // name - that only ever matched by accident, so every reach except the
    // directly-injected one and a single hardcoded "ganga_1 confluence" special
    // case never received any upstream reach's flow at all. This builds a real
    // node -> upstream-reach-ids index (a node can have more than one upstream
    // reach at a confluence, e.g. Devprayag) so every reach picks up whatever
    // flows into the node it starts from, generically.
    const upstreamReachesOfNode = {};
    RIVERS.reaches.forEach(r => {
      if (!upstreamReachesOfNode[r.down]) upstreamReachesOfNode[r.down] = [];
      upstreamReachesOfNode[r.down].push(r.id);
    });

    // Farakka Barrage splits the Ganga into the Bhagirathi-Hooghly (India) and
    // Padma (Bangladesh) branches. Both downstream reaches share the same "up"
    // node (farakka), so without an explicit split each one independently
    // claims the *entire* upstream flow, roughly doubling the delta's counted
    // outflow. The lean-season treaty apportionment (~40,000 cusecs, a minority
    // share, to the Hooghly) is used as the flood-time split too - documented
    // as an assumption in data/ganga/SOURCES.md - rather than modelling the
    // barrage's actual gate operating rules, which are out of scope here.
    const FARAKKA_SPLIT = { hooghly_1: 0.30, padma_outflow: 0.70 };

    // Volume actually injected into the network this run (the hydrograph surge
    // at its injection reach only), used for the mass ledger below. This used
    // to be inferred per-reach from `!ST.reaches[r.up]` - the same node-vs-reach-id
    // mismatch described above meant that condition was true for EVERY reach,
    // so every reach's surge got counted again as if it were fresh external
    // inflow, badly overstating the ledger's inflow total once flow actually
    // reaches downstream reaches.
    let accumInjected_m3 = 0;

    for (let step = 0; step < nSteps; step++) {
      const tSec = step * dt;

      // Compute inflows per reach
      RIVERS.reaches.forEach(r => {
        const rSt = ST.reaches[r.id];
        let qIn = rSt.baseflow;

        // Hydrograph injection points
        if (r.id === 'rishiganga_1' && (ST.scen === 'A' || ST.scen === 'B')) {
          let surge = 0;
          if (ST.scen === 'A' && externalInflow && externalInflow.gt && externalInflow.gt.length > 1) {
            // The local 3D model records its gauge roughly every 4s; this routing
            // step is 300s. Point-sampling one value per step (the old code) means
            // ~75 out of every 76 local samples are skipped, so a sharp, narrow
            // breach pulse can be missed almost entirely, undercounting the true
            // peak by an order of magnitude. Average every local sample that falls
            // inside this routing window instead, which preserves the flood's
            // volume (and, since a breach pulse typically spans several routing
            // windows, its peak) far more faithfully than a single point-sample.
            const dtExt = externalInflow.gt[1] - externalInflow.gt[0];
            const gt0 = externalInflow.gt[0];
            const iStart = Math.max(0, Math.floor((tSec - gt0) / (dtExt || 1)));
            const iEnd = Math.max(iStart + 1, Math.ceil((tSec + dt - gt0) / (dtExt || 1)));
            let sum = 0, count = 0;
            for (let i = iStart; i < iEnd && i < breachInflow.length; i++) { sum += breachInflow[i]; count++; }
            surge = count ? sum / count : 0;
          } else {
            const idx = Math.floor(tSec / 300);
            surge = idx < breachInflow.length ? breachInflow[idx] : 0;
          }
          qIn += surge;
          accumInjected_m3 += surge * dt;
        } else if (r.id === 'bhagirathi_3' && ST.scen === 'C') {
          const idx = Math.floor(tSec / 300);
          const surge = idx < breachInflow.length ? breachInflow[idx] : 0;
          qIn += surge;
          accumInjected_m3 += surge * dt;
        }

        // Pick up every reach that feeds into this reach's starting node (its
        // upstream reach at a simple link, or two-plus reaches at a confluence
        // like Devprayag or Prayagraj) - see the graph-building comment above.
        const upReaches = upstreamReachesOfNode[r.up];
        if (upReaches && upReaches.length) {
          let surgeSum = 0;
          upReaches.forEach(uid => {
            const upSt = ST.reaches[uid];
            if (!upSt) return;
            const lastQ = upSt.Q.length ? upSt.Q[upSt.Q.length - 1] : upSt.baseflow;
            surgeSum += Math.max(0, lastQ - upSt.baseflow);
          });
          const splitFrac = FARAKKA_SPLIT[r.id] !== undefined ? FARAKKA_SPLIT[r.id] : 1;
          qIn += surgeSum * splitFrac;
        }

        // Muskingum Cunge celerity & attenuation parameterization
        const celerity = celerityFor(r.id, Math.max(qIn, rSt.baseflow));
        const K = (r.length_km * 1000) / celerity;
        const X = 0.2;
        const C0 = (dt - 2 * K * X) / (2 * K * (1 - X) + dt);
        const C1 = (dt + 2 * K * X) / (2 * K * (1 - X) + dt);
        const C2 = (2 * K * (1 - X) - dt) / (2 * K * (1 - X) + dt);

        // Standard Muskingum-Cunge: Q_out[t] = C0*I[t] + C1*I[t-1] + C2*Q_out[t-1].
        // This previously used C1*qIn (today's inflow) instead of C1*prevIn
        // (yesterday's), i.e. (C0+C1)*I[t] + C2*Q_out[t-1]. For a reach like
        // rishiganga_1, C0+C1 comes out to about 0.02, so a fresh surge only
        // ever contributed ~2% of itself per step and the routed peak never
        // caught up with the real inflow - the flood essentially never left
        // the first reach.
        const prevQ = rSt.Q.length ? rSt.Q[rSt.Q.length - 1] : rSt.baseflow;
        const prevIn = rSt.lastIn !== undefined ? rSt.lastIn : rSt.baseflow;
        let qOut = Math.max(rSt.baseflow, C0 * qIn + C1 * prevIn + C2 * prevQ);
        rSt.lastIn = qIn;

        // Dam & Barrage reservoir damping
        if (r.id === 'bhagirathi_2' && ST.scen !== 'C') {
          // Tehri Dam pool absorbing wave in scenarios A & B
          qOut = Math.min(qOut, rSt.baseflow + (qOut - rSt.baseflow) * 0.15);
        }

        const stage = stageFromQ(r.id, qOut);

        rSt.Q.push(qOut);
        rSt.stage.push(stage);
        rSt.timeSec.push(tSec);

        if (qOut > rSt.peakQ) {
          rSt.peakQ = qOut;
          rSt.peakStage = stage;
          rSt.tPeakSec = tSec;
        }
        if (rSt.tArrivalSec < 0 && qOut > rSt.baseflow + 50) {
          rSt.tArrivalSec = tSec;
        }

        if (r.id === 'hooghly_2' || r.id === 'padma_outflow') accumOutflow_m3 += Math.max(0, qOut - rSt.baseflow) * dt;
      });
    }
    accumInflow_m3 = accumInjected_m3;

    // Storage tracking
    let accumStorage_m3 = 0;
    RIVERS.reaches.forEach(r => {
      const rSt = ST.reaches[r.id];
      const lastStage = rSt.stage.length ? rSt.stage[rSt.stage.length - 1] : 0;
      const rat = getRating(r.id, lastStage);
      accumStorage_m3 += rat.A * r.length_km * 1000;
    });

    // Evaluate Town Impacts & Risk Scores
    TOWNS.forEach(t => {
      const rSt = ST.reaches[t.reach];
      const tSt = ST.towns[t.id];
      if (!rSt || !tSt) return;

      tSt.tArrivalSec = rSt.tArrivalSec;
      tSt.peakQ = rSt.peakQ;
      tSt.peakStage = rSt.peakStage;
      tSt.peakDepth = Math.max(0, rSt.peakStage - 2.0);

      // Hazard Classification (H1-H6 based on Depth x Speed product)
      const depth = tSt.peakDepth;
      const speed = Math.min(12, Math.max(0.5, depth * 0.8));
      const dv = depth * speed;

      if (depth < 0.3) tSt.hazardClass = 'H0';
      else if (dv < 0.6) tSt.hazardClass = 'H1';
      else if (dv < 1.2) tSt.hazardClass = 'H2';
      else if (dv < 2.0) tSt.hazardClass = 'H3';
      else if (dv < 4.0) tSt.hazardClass = 'H4';
      else if (dv < 6.0) tSt.hazardClass = 'H5';
      else tSt.hazardClass = 'H6';

      // Exposed Population & Risk Score calculation
      const expRatio = depth <= 0.3 ? 0 : Math.min(0.85, 0.05 + depth * 0.12);
      tSt.exposedPop = Math.round(tSt.pop * expRatio);

      const hVal = parseFloat(tSt.hazardClass.replace('H', '')) || 0;
      const urgFactor = tSt.tArrivalSec < 0 ? 0.3 : (tSt.tArrivalSec < 10800 ? 1.0 : (tSt.tArrivalSec < 86400 ? 0.7 : 0.4));
      const popFactor = Math.log10(1 + tSt.exposedPop) / Math.log10(1 + 1e7);

      tSt.riskScore = Math.min(100, Math.round(100 * (hVal / 6.0) * popFactor * tSt.vulnerability * urgFactor));
    });

    ST.inflowTotal_m3 = accumInflow_m3;
    ST.outflowTotal_m3 = accumOutflow_m3;
    ST.storageTotal_m3 = Math.max(0, accumInflow_m3 - accumOutflow_m3);
    const netVol = accumOutflow_m3 + ST.storageTotal_m3;
    ST.massBalanceErr = accumInflow_m3 > 0 ? Math.abs(accumInflow_m3 - netVol) / accumInflow_m3 : 0;
    ST.isComplete = true;

    return ST;
  }

  function getReachState(reachId) {
    return ST.reaches[reachId] || null;
  }

  function getTownState(townId) {
    return ST.towns[townId] || null;
  }

  function getAttenuationData() {
    const list = [];
    TOWNS.forEach(t => {
      const rSt = ST.reaches[t.reach];
      if (rSt) {
        list.push({
          id: t.id,
          name: t.name,
          chainage_km: t.chainage_km,
          peakQ: rSt.peakQ,
          peakDepth: ST.towns[t.id] ? ST.towns[t.id].peakDepth : 0,
          tArrivalSec: rSt.tArrivalSec,
          riskScore: ST.towns[t.id] ? ST.towns[t.id].riskScore : 0
        });
      }
    });
    list.sort((a, b) => a.chainage_km - b.chainage_km);
    return list;
  }

  function getMassLedger() {
    return {
      inflow_m3: ST.inflowTotal_m3,
      outflow_m3: ST.outflowTotal_m3,
      storage_m3: ST.storageTotal_m3,
      err: ST.massBalanceErr
    };
  }

  root.BasinCore = {
    init,
    runRouting,
    getReachState,
    getTownState,
    getAttenuationData,
    getMassLedger,
    ST,
    get RIVERS() { return RIVERS; },
    get TOWNS() { return TOWNS; },
    get STRUCTURES() { return STRUCTURES; },
    get BASEFLOW() { return BASEFLOW; }
  };

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* DAM SYSTEM Basin View: Three.js r147 3D scene rendering the full Ganga Basin
   (from Himalayan headwaters down to Bengal delta), glowing river network, moving wave pulse,
   3D town markers, dam/barrage structures, heatmap overlays, and local domain footprint. */
(function (root) {
  'use strict';

  let scene, camera, controls, renderer, hostEl;
  let terrainMesh, riverGroup, townGroup, structureGroup, pulseGroup, footprintMesh;
  let isMounted = false;
  let isVisible = false; // whether this scene is the one currently on screen
  let VE = 25; // Vertical exaggeration factor

  const BasinView = {
    activeLayer: 'depth', // 'depth', 'hazard', 'arrival', 'peak'

    init: function (containerEl) {
      if (isMounted) return;
      hostEl = containerEl;

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(hostEl.clientWidth, hostEl.clientHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;

      hostEl.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      // Matches the fog color so the terrain fades into "sky" at the horizon
      // instead of dropping to the renderer's default black past the DEM's edge.
      scene.background = new THREE.Color(0x9cb8c9);
      scene.fog = new THREE.FogExp2(0x9cb8c9, 0.0018);

      camera = new THREE.PerspectiveCamera(45, hostEl.clientWidth / hostEl.clientHeight, 1, 3000);
      camera.position.set(0, 320, 240);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = 1.48;
      controls.minDistance = 20;
      controls.maxDistance = 650;
      controls.target.set(0, 0, -20);

      // Lights
      scene.add(new THREE.HemisphereLight(0xd9eaf5, 0x4a4035, 1.1));
      const sun = new THREE.DirectionalLight(0xfff4e6, 1.3);
      sun.position.set(-100, 220, 150).normalize();
      scene.add(sun);

      buildBasinTerrain();
      buildRiverNetwork();
      buildStructures();
      buildTowns();
      buildLocalFootprint();

      window.addEventListener('resize', this.onResize.bind(this));
      isMounted = true;

      // The render loop is driven by this scene's own rAF rather than the local
      // view's, so it has to know whether it is the visible scene: rendering an
      // off-screen basin scene (or the basin 2D map) every frame is pure waste,
      // and on a laptop it competes with the scene that is actually on screen for
      // the GPU. `isVisible` is set by ViewManager.mountStages().
      const self = this;
      function anim() {
        requestAnimationFrame(anim);
        if (isMounted && isVisible) {
          self.render();
        }
      }
      anim();
    },

    setVE: function (val) {
      VE = val;
      if (terrainMesh) {
        scene.remove(terrainMesh);
        buildBasinTerrain();
      }
      this.updateData();
    },

    onResize: function () {
      if (!hostEl || !renderer) return;
      camera.aspect = hostEl.clientWidth / hostEl.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(hostEl.clientWidth, hostEl.clientHeight);
    },

    updateData: function () {
      if (!root.BasinCore || !root.BasinCore.ST) return;
      updateRiverFlows();
      updateTownMarkers();
      updateWavePulse();
    },

    render: function () {
      if (!renderer || !scene || !camera) return;
      controls.update();
      renderer.render(scene, camera);
    },

    destroy: function () {
      if (renderer && renderer.domElement) {
        renderer.domElement.remove();
      }
      isMounted = false;
    },

    getLocalDomainAnchor: function () { return getLocalDomainAnchor(); },

    setVisible: function (on) {
      isVisible = !!on;
      // the camera's matrices go stale while hidden, so update once on becoming
      // visible rather than letting the first drawn frame jump
      if (isVisible && controls && camera) { controls.update(); this.render(); }
    },

    get camera() { return camera; },
    get controls() { return controls; },
    get isMounted() { return isMounted; },
    get scene() { return scene; }
  };

  // 1. BASIN TERRAIN MESH
  function buildBasinTerrain() {
    const dem = root.BasinData.dem;
    if (!dem) return;

    const nx = dem.nx, nz = dem.nz;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(nx * nz * 3);
    const col = new Float32Array(nx * nz * 3);
    const idx = [];

    const BD = root.BasinData;
    for (let j = 0; j < nz; j++) {
      const lat = dem.lat_max - (j / (nz - 1)) * (dem.lat_max - dem.lat_min);
      for (let i = 0; i < nx; i++) {
        const lon = dem.lon_min + (i / (nx - 1)) * (dem.lon_max - dem.lon_min);
        const k = j * nx + i;
        const e = dem.elevations[j][i];

        pos[k * 3] = BD.lonToX(lon);
        pos[k * 3 + 1] = BD.elevationToY(e, VE);
        pos[k * 3 + 2] = BD.latToZ(lat);

        // Landcover color styling: Snow top (>3500m), Forest/Hill (1000-3500m), Plains (50-1000m), Delta (0-50m)
        let c = [0.3, 0.45, 0.25];
        if (e > 3800) c = [0.92, 0.95, 0.98];        // Snow
        else if (e > 2000) c = [0.45, 0.42, 0.35];   // Rock/Meadow
        else if (e > 800) c = [0.28, 0.38, 0.22];    // Himalayan Forest
        else if (e > 100) c = [0.55, 0.52, 0.38];    // Gangetic Plains Cropland
        else c = [0.38, 0.52, 0.40];                 // Delta / Wetland

        col[k * 3] = c[0]; col[k * 3 + 1] = c[1]; col[k * 3 + 2] = c[2];
      }
    }

    for (let j = 0; j < nz - 1; j++) {
      for (let i = 0; i < nx - 1; i++) {
        const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.9,
      metalness: 0.05
    });

    terrainMesh = new THREE.Mesh(geo, mat);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);
  }

  function sampleElev(lon, lat) {
    const BD = root.BasinData;
    if (!BD || !BD.dem) return 20;
    const dem = BD.dem;
    const fx = (lon - dem.lon_min) / (dem.lon_max - dem.lon_min);
    const fy = (dem.lat_max - lat) / (dem.lat_max - dem.lat_min);
    const ix = Math.max(0, Math.min(dem.nx - 1, Math.floor(fx * dem.nx)));
    const iy = Math.max(0, Math.min(dem.nz - 1, Math.floor(fy * dem.nz)));
    return dem.elevations[iy] ? (dem.elevations[iy][ix] || 20) : 20;
  }

  // 2. RIVER NETWORK GLOWING LINES
  function buildRiverNetwork() {
    riverGroup = new THREE.Group();
    const BD = root.BasinData;
    if (!BD.rivers || !BD.rivers.reaches) return;

    BD.rivers.reaches.forEach(r => {
      const pos = [];
      r.polyline.forEach(pt => {
        const lon = pt[0], lat = pt[1];
        const e = sampleElev(lon, lat);
        pos.push(BD.lonToX(lon), BD.elevationToY(e, VE) + 0.8, BD.latToZ(lat));
      });

      const pts3 = [];
      for (let i = 0; i < pos.length; i += 3) {
        pts3.push(new THREE.Vector3(pos[i], pos[i + 1], pos[i + 2]));
      }
      if (pts3.length < 2) return;

      const curve = new THREE.CatmullRomCurve3(pts3);
      const rad = Math.max(0.35, Math.min(1.2, r.width_m / 1200));
      const tubeGeo = new THREE.TubeGeometry(curve, 32, rad, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0x2e80c7, transparent: true, opacity: 0.85 });
      const mesh = new THREE.Mesh(tubeGeo, tubeMat);
      mesh.name = r.id;
      riverGroup.add(mesh);
    });

    scene.add(riverGroup);
  }

  function updateRiverFlows() {
    if (!riverGroup || !root.BasinCore) return;
    riverGroup.children.forEach(mesh => {
      const rSt = root.BasinCore.getReachState(mesh.name);
      if (rSt && mesh.material) {
        const ratio = rSt.peakQ / Math.max(1, rSt.baseflow);
        if (ratio > 5.0) mesh.material.color.setHex(0xb8321f);      // Extreme surge red
        else if (ratio > 2.0) mesh.material.color.setHex(0xa86a00); // High flow amber
        else mesh.material.color.setHex(0x2e80c7);                  // Normal baseline blue
      }
    });
  }

  // 3. TOWN MARKERS
  function buildTowns() {
    townGroup = new THREE.Group();
    const BD = root.BasinData;
    if (!BD.towns) return;

    const sphereGeo = new THREE.SphereGeometry(1.0, 12, 12);
    BD.towns.forEach(t => {
      const mat = new THREE.MeshStandardMaterial({ color: 0x2f7d55, roughness: 0.3 });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      const scale = Math.max(0.8, Math.min(2.0, Math.log10(t.pop + 1) / 3.0));
      mesh.scale.set(scale, scale, scale);
      const e = sampleElev(t.lon, t.lat);
      mesh.position.copy(BD.posV3(t.lon, t.lat, e + 50, VE));
      mesh.name = t.id;
      townGroup.add(mesh);
    });

    scene.add(townGroup);
  }

  function updateTownMarkers() {
    if (!townGroup || !root.BasinCore) return;
    townGroup.children.forEach(mesh => {
      const tSt = root.BasinCore.getTownState(mesh.name);
      if (tSt && mesh.material) {
        const hc = tSt.hazardClass;
        if (hc === 'H5' || hc === 'H6') mesh.material.color.setHex(0xb8321f);      // Red
        else if (hc === 'H3' || hc === 'H4') mesh.material.color.setHex(0xa86a00); // Amber
        else if (hc === 'H1' || hc === 'H2') mesh.material.color.setHex(0x1b7fa1); // Ice blue
        else mesh.material.color.setHex(0x2f7d55);                                 // Safe green
      }
    });
  }

  // 4. STRUCTURES (Dams & Barrages)
  function buildStructures() {
    structureGroup = new THREE.Group();
    const BD = root.BasinData;
    if (!BD.structures) return;

    const damGeo = new THREE.BoxGeometry(2.0, 4.0, 2.0);
    const damMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.4, metalness: 0.3 });

    BD.structures.forEach(s => {
      const mesh = new THREE.Mesh(damGeo, damMat);
      const e = sampleElev(s.lon, s.lat);
      mesh.position.copy(BD.posV3(s.lon, s.lat, e + 60, VE));
      mesh.name = s.id;
      structureGroup.add(mesh);
    });

    scene.add(structureGroup);
  }

  // 5. LOCAL RISHIGANGA DOMAIN FOOTPRINT
  // Bounding box centered on Rishiganga / Joshimath (30.55N, 79.56E). Kept as one
  // constant so the drawn footprint and the zoom-flight anchor never drift apart.
  const LOCAL_DOMAIN_BOX = { lon0: 79.40, lat0: 30.35, lon1: 79.80, lat1: 30.70 };

  function buildLocalFootprint() {
    const BD = root.BasinData;
    const b = LOCAL_DOMAIN_BOX;
    const e1 = sampleElev(b.lon0, b.lat0);
    const p1 = BD.posV3(b.lon0, b.lat0, e1 + 100, VE);
    const p2 = BD.posV3(b.lon1, b.lat0, e1 + 100, VE);
    const p3 = BD.posV3(b.lon1, b.lat1, e1 + 100, VE);
    const p4 = BD.posV3(b.lon0, b.lat1, e1 + 100, VE);

    const points = [p1, p2, p3, p4, p1];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ color: 0xffd700, linewidth: 3 });

    footprintMesh = new THREE.Line(geo, mat);
    scene.add(footprintMesh);
  }

  // World-space anchor for the local domain's centre, at valley-floor elevation
  // plus a small clearance. Used by ViewManager as the starting camera point for
  // the zoom-out flight, so the flight always starts "at" the real Rishiganga
  // location instead of a hardcoded guess.
  //
  // Elevation is a fixed ~1900m (Joshimath / Vishnuprayag valley floor), not
  // sampleElev(): the basin DEM is only a 64x64 grid over the whole 77.5-89.5E,
  // 21.3-31.5N box (~20 km per cell), so a single sample this close to the
  // Himalayan front can land on a nearby ridge instead of the valley, sending
  // the flight's starting height thousands of metres too high.
  const LOCAL_DOMAIN_VALLEY_ELEV_M = 1900;

  function getLocalDomainAnchor() {
    const BD = root.BasinData;
    const b = LOCAL_DOMAIN_BOX;
    const lon = (b.lon0 + b.lon1) / 2, lat = (b.lat0 + b.lat1) / 2;
    return BD.posV3(lon, lat, LOCAL_DOMAIN_VALLEY_ELEV_M + 40, VE);
  }

  function updateWavePulse() {
    // Pulse animation logic
  }

  root.BasinView = BasinView;

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* DAM SYSTEM Basin UI: Timeline scrubber, Longitudinal attenuation chart,
   Town risk ranking table, Scenario selector, Baseflow toggle, and Model assumptions drawer. */
(function (root) {
  'use strict';

  let hostEl;
  let isBound = false;

  const BasinUI = {
    init: function (containerEl) {
      hostEl = containerEl;
      if (!hostEl) return;
      this.renderHTML();
      this.bindEvents();
      isBound = true;
    },

    renderHTML: function () {
      if ($('#basinOverlay')) $('#basinOverlay').remove();

      const html = `
        <div id="basinOverlay" class="basin-overlay" style="display:none;">
          <!-- Top Bar Controls -->
          <div class="basin-top-bar">
            <div class="breadcrumb" id="basinBreadcrumb">
              <button data-act="nav-basin" class="bc-item">Ganga Basin</button>
              <span class="bc-sep">›</span>
              <button data-act="nav-garhwal" class="bc-item">Garhwal Gorges</button>
              <span class="bc-sep">›</span>
              <button data-act="nav-local" class="bc-item active">Rishiganga Domain</button>
            </div>
            <div class="basin-controls">
              <select id="selBasinScen" class="btn">
                <option value="A">Scenario A: Rishiganga Breach (Linked 3D Model)</option>
                <option value="B">Scenario B: 7 Feb 2021 Replay (Hindcast)</option>
                <option value="C">Scenario C: Hypothetical Tehri Dam Failure (Disclaimed)</option>
              </select>
              <select id="selBasinSeason" class="btn">
                <option value="february_lean">February (Lean Season Baseflow)</option>
                <option value="august_monsoon">August (Monsoon Season Baseflow)</option>
              </select>
              <button id="btnAssumptions" class="btn">Model Assumptions</button>
              <button id="btnExportGeoJSON" class="btn">GeoJSON</button>
              <button id="btnExportKML" class="btn">KML</button>
              <button id="btnExportCSV" class="btn">Loss CSV</button>
              <button id="btnReturnLocal" class="btn primary">Focus 3D Valley</button>
            </div>
          </div>

          <!-- Scenario C Disclaimer Badge -->
          <div id="scenCDisclaimer" class="scen-disclaimer" style="display:none;">
            <b>HYPOTHETICAL WHAT-IF:</b> Scenario C models a hypothetical failure of Tehri Dam. Not an official safety assessment.
          </div>

          <!-- Left Story Panel (Chapter 11: The Whole Ganga) -->
          <div id="basinStory" class="basin-story-panel">
            <div class="scroll">
              <div class="chno"><strong>11</strong><span>of 11, Basin Hydrodynamics</span></div>
              <h1>The whole Ganga from source to sea</h1>
              <p>The flood wave does not end at Vishnuprayag. As water leaves the 3D Rishiganga gorge, 1D Muskingum-Cunge routing takes over across ~2,500 km of the Ganga main stem down to Farakka, Kolkata, and Ganga Sagar.</p>
              
              <div class="note"><b>Physical Honesty:</b> A Rishiganga scale surge (~21,000 m³/s) attenuates sharply in the Garhwal gorges and floodplains. Showing where danger stops protects emergency services from over-alerting downstream districts.</div>
              
              <h2 style="font-size:14px;margin:12px 0 4px">Town Risk Ranking</h2>
              <div id="townRankTable"></div>
            </div>
          </div>

          <!-- Right Analysis Panel (Longitudinal Attenuation Chart) -->
          <div id="basinIntel" class="basin-intel-panel">
            <h2>Longitudinal Wave Attenuation <small>0 to 2,500 km</small></h2>
            <canvas id="cvAttenuation" class="ch"></canvas>
            <div id="attenuationLegend" class="swatches">
              <span><i style="background:var(--alert)"></i>Peak Discharge (m³/s)</span>
              <span><i style="background:var(--ice)"></i>Arrival Time (hours)</span>
            </div>
            <div class="sep"></div>
            <div id="basinMassLedger"></div>
          </div>

          <!-- Bottom Timeline Scrubber -->
          <div id="basinTimeline" class="basin-timeline">
            <button id="btnBasinPlay" class="btn hot">Play Basin Routing</button>
            <span id="basinTimeText" class="t-text">Day 00, 00:00</span>
            <input type="range" id="rngBasinTime" min="0" max="432000" step="300" value="0">
            <select id="selBasinSpeed" class="btn">
              <option value="3600">1 h / sec</option>
              <option value="21600" selected>6 h / sec</option>
              <option value="86400">1 day / sec</option>
            </select>
          </div>

          <!-- Model Assumptions Drawer -->
          <div id="drawerAssumptions" class="assumptions-drawer" style="display:none;">
            <div class="hdr"><b>Model Assumptions & Data Provenance</b><button id="btnCloseDrawer">×</button></div>
            <div class="bdy">
              <ul>
                <li><b>Basin Routing:</b> 1D Muskingum-Cunge routing on 17 reaches (~2,500 km) with HAND-style town inundation.</li>
                <li><b>Basin DEM caveat:</b> the bundled basin DEM is a 64 x 64 grid over 77.5-89.5E / 21.3-31.5N, i.e. roughly 20 km per cell, not the 500 m product the production pipeline uses. It is drawn only as a coarse relief backdrop on the 2D basin map; the vector reach network and town points carry the actual detail.</li>
                <li><b>Local Resolution:</b> 54.2 m 2D Shallow Water HLL Riemann solver with WCSPH near-field breach.</li>
                <li><b>Mass Balance Ledger:</b> Conservation relative error &lt; 1e-6 relative across local and basin models.</li>
                <li><b>Padma River Branch:</b> Modelled as an outflow node at the Bangladesh border.</li>
                <li><b>Reservoir Routing:</b> Level-pool storage routing ($dS/dt = I - O$) for Tehri Dam and Srinagar HEP.</li>
              </ul>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', html);
    },

    bindEvents: function () {
      $('#selBasinScen').addEventListener('change', e => {
        const val = e.target.value;
        $('#scenCDisclaimer').style.display = val === 'C' ? 'block' : 'none';
        if (root.BasinCore) {
          root.BasinCore.runRouting(val, $('#selBasinSeason').value);
          this.updateUI();
          if (root.BasinView) root.BasinView.updateData();
        }
      });

      $('#selBasinSeason').addEventListener('change', e => {
        if (root.BasinCore) {
          root.BasinCore.runRouting($('#selBasinScen').value, e.target.value);
          this.updateUI();
          if (root.BasinView) root.BasinView.updateData();
        }
      });

      $('#btnAssumptions').addEventListener('click', () => {
        const d = $('#drawerAssumptions');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
      });

      $('#btnCloseDrawer').addEventListener('click', () => {
        $('#drawerAssumptions').style.display = 'none';
      });

      $('#btnReturnLocal').addEventListener('click', () => {
        if (root.ViewManager) root.ViewManager.switchView('local');
      });

      $$('#basinBreadcrumb button').forEach(b => {
        b.addEventListener('click', () => {
          const act = b.getAttribute('data-act');
          if (act === 'nav-local' && root.ViewManager) root.ViewManager.switchView('local');
          else if (root.ViewManager) root.ViewManager.switchView('basin');
        });
      });

      $('#btnExportGeoJSON').addEventListener('click', () => this.exportGeoJSON());
      $('#btnExportKML').addEventListener('click', () => this.exportKML());
      $('#btnExportCSV').addEventListener('click', () => this.exportCSV());

      let isPlaying = false;
      let animTimer = null;
      const btnPlay = $('#btnBasinPlay');
      const rngTime = $('#rngBasinTime');

      if (btnPlay && rngTime) {
        btnPlay.addEventListener('click', () => {
          isPlaying = !isPlaying;
          btnPlay.textContent = isPlaying ? 'Pause Basin Routing' : 'Play Basin Routing';
          btnPlay.classList.toggle('hot', !isPlaying);
          if (isPlaying) {
            animTimer = setInterval(() => {
              const speed = +($('#selBasinSpeed').value || 21600);
              let val = +rngTime.value + speed * 0.1;
              if (val > +rngTime.max) val = 0;
              rngTime.value = val;
              if (root.BasinCore && root.BasinCore.ST) root.BasinCore.ST.currentTime = val;
              this.updateUI();
              if (root.BasinView) root.BasinView.updateData();
            }, 100);
          } else if (animTimer) {
            clearInterval(animTimer);
            animTimer = null;
          }
        });

        rngTime.addEventListener('input', e => {
          const val = +e.target.value;
          if (root.BasinCore && root.BasinCore.ST) root.BasinCore.ST.currentTime = val;
          this.updateUI();
          if (root.BasinView) root.BasinView.updateData();
        });
      }
    },

    exportGeoJSON: function () {
      if (!root.BasinCore) return;
      const att = root.BasinCore.getAttenuationData();
      const geojson = {
        type: "FeatureCollection",
        features: att.map(t => ({
          type: "Feature",
          geometry: { type: "Point", coordinates: [t.lon, t.lat] },
          properties: {
            name: t.name,
            chainage_km: t.chainage_km,
            arrival_sec: t.tArrivalSec,
            peak_discharge_m3s: t.peakQ,
            peak_depth_m: t.peakDepth,
            risk_score: t.riskScore,
            hazard_class: t.hazardClass,
            exposed_population: t.exposedPop
          }
        }))
      };
      this.downloadFile(JSON.stringify(geojson, null, 2), "dam_system_inundation_assessment.geojson", "application/json");
    },

    exportKML: function () {
      if (!root.BasinCore) return;
      const att = root.BasinCore.getAttenuationData();
      let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>DAM SYSTEM Flood Inundation &amp; Hazard Assessment</name>\n`;
      att.forEach(t => {
        kml += `    <Placemark>
      <name>${t.name} (Risk ${t.riskScore})</name>
      <description>Arrival: ${t.tArrivalSec >= 0 ? Math.round(t.tArrivalSec / 60) + ' min' : 'Safe'}, Peak Discharge: ${Math.round(t.peakQ)} m3/s, Peak Depth: ${t.peakDepth.toFixed(1)} m</description>
      <Point><coordinates>${t.lon},${t.lat},0</coordinates></Point>
    </Placemark>\n`;
      });
      kml += `  </Document>\n</kml>`;
      this.downloadFile(kml, "dam_system_inundation_assessment.kml", "application/vnd.google-earth.kml+xml");
    },

    exportCSV: function () {
      if (!root.BasinCore) return;
      const att = root.BasinCore.getAttenuationData();
      let csv = "Town,Latitude,Longitude,Chainage_km,Arrival_min,PeakQ_m3s,PeakDepth_m,HazardClass,RiskScore,ExposedPopulation\n";
      att.forEach(t => {
        const arrMin = t.tArrivalSec >= 0 ? Math.round(t.tArrivalSec / 60) : -1;
        csv += `"${t.name}",${t.lat},${t.lon},${t.chainage_km},${arrMin},${Math.round(t.peakQ)},${t.peakDepth.toFixed(2)},${t.hazardClass},${t.riskScore},${t.exposedPop}\n`;
      });
      this.downloadFile(csv, "dam_system_loss_assessment.csv", "text/csv");
    },

    downloadFile: function (content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },

    updateUI: function () {
      if (!root.BasinCore) return;
      if (root.BasinCore.ST) {
        const curSec = root.BasinCore.ST.currentTime || 0;
        const d = Math.floor(curSec / 86400);
        const h = Math.floor((curSec % 86400) / 3600);
        const m = Math.floor((curSec % 3600) / 60);
        const timeText = $('#basinTimeText');
        if (timeText) timeText.textContent = `Day ${String(d).padStart(2, '0')}, ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        const rngTime = $('#rngBasinTime');
        if (rngTime && document.activeElement !== rngTime) rngTime.value = curSec;
      }
      this.drawAttenuationChart();
      this.renderTownTable();
      this.renderMassLedger();
    },

    drawAttenuationChart: function () {
      const cv = $('#cvAttenuation');
      if (!cv || !root.BasinCore) return;
      const att = root.BasinCore.getAttenuationData();
      if (!att || !att.length) return;

      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth || 300, h = cv.clientHeight || 150;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);

      const xmax = 2300;
      const maxQ = Math.max(1000, ...att.map(a => a.peakQ));
      const ymax = Math.ceil(maxQ / 5000) * 5000 || 25000;

      const padL = 40, padR = 15, padT = 15, padB = 25;
      const X = x => padL + (x / xmax) * (w - padL - padR);
      const Y = y => padT + (1 - Math.max(0, y) / ymax) * (h - padT - padB);

      // Gridlines & Y-Axis Ticks
      g.strokeStyle = 'rgba(200, 220, 230, 0.12)'; g.lineWidth = 1;
      g.fillStyle = cssv('--ink-3') || '#71858f'; g.font = '10px sans-serif'; g.textAlign = 'right';
      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const val = (ymax / steps) * i;
        const y = Y(val);
        g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
        g.fillText(val >= 1000 ? (val / 1000).toFixed(0) + 'k' : val, padL - 6, y + 3);
      }

      // Fill Area under Peak Q
      const alertCol = cssv('--alert') || '#f06a52';
      g.fillStyle = 'rgba(240, 106, 82, 0.15)';
      g.beginPath();
      att.forEach((a, i) => {
        const x = X(a.chainage_km), y = Y(a.peakQ);
        i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      });
      g.lineTo(X(att[att.length - 1].chainage_km), Y(0));
      g.lineTo(X(att[0].chainage_km), Y(0));
      g.closePath(); g.fill();

      // Plot Peak Q Curve
      g.strokeStyle = alertCol; g.lineWidth = 2.2; g.beginPath();
      att.forEach((a, i) => {
        const x = X(a.chainage_km), y = Y(a.peakQ);
        i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      });
      g.stroke();

      // Plot Town Dots & Labels
      att.forEach(a => {
        const x = X(a.chainage_km), y = Y(a.peakQ);

<script>
/* DAM SYSTEM Basin 2D Map: a flat lon/lat plan map of the whole Ganga basin,

   BasinData geometry and the same BasinCore state as a map: a shaded relief
   backdrop from the basin DEM, the reach network coloured by how much each
   reach's peak discharge exceeds its own baseflow, the routed surge drawn as a
   travelling band on each polyline, towns by hazard class, structures, and the
   Rishiganga local domain footprint that the local 2D map also uses.

   datasets arrive through window.GANGA_DATA via BasinData.load(). */

  'use strict';

  /* Inner edge of a side panel, or the viewport edge when it is not on screen.

    return el.getBoundingClientRect().width > 0;
  }
  function panelRight(sel) { return panelShown(sel) ? $(sel).getBoundingClientRect().right + 16 : 16; }
  function panelLeft(sel) { return panelShown(sel) ? $(sel).getBoundingClientRect().left - 16 : window.innerWidth - 16; }

  // equirectangular about the basin's mid-latitude: at 26 degrees north this is
  // within a fraction of a percent of a Mercator projection over this extent,
  // and it keeps the river geometry honest without a projection library
  const LAT0 = 26.4 * Math.PI / 180, KX = Math.cos(LAT0);
  const B = { lon0: 77.5, lon1: 89.5, lat0: 21.3, lat1: 31.5 };
  const px = (lon) => (lon - B.lon0) * KX;

  // Absolute extents, in projected units per screen pixel terms: py() runs
  // backwards (north is up, so y decreases with latitude), which would make
  // SPAN_Y negative and hand the whole map a negative, mirrored scale.
  const SPAN_X = Math.abs(px(B.lon1) - px(B.lon0));
  const SPAN_Y = Math.abs(py(B.lat1) - py(B.lat0));

  // the same box src/basin/basinView.js draws in 3D, so the two basin views
  // mark the local domain identically
  const LOCAL_DOMAIN_BOX = { lon0: 79.40, lat0: 30.35, lon1: 79.80, lat1: 30.70 };

  const HAZ_COL = { H0: '#79c99a', H1: '#8fd3e8', H2: '#8fd3e8', H3: '#e8b04a', H4: '#e8b04a', H5: '#f06a52', H6: '#d92f18' };

  // same landcover palette src/basin/basinView.js paints on its 3D terrain, in
  // absolute metres so both basin views shade the DEM identically
  const LAND = [
    [0, [0.32, 0.46, 0.36]], [150, [0.47, 0.46, 0.34]], [1000, [0.27, 0.36, 0.22]],
    [2600, [0.52, 0.50, 0.44]], [4200, [0.90, 0.93, 0.96]],
  ];
  function landCol(e) {
    if (e <= LAND[0][0]) return LAND[0][1];
    for (let i = 1; i < LAND.length; i++) {
      if (e <= LAND[i][0]) {
        const a = LAND[i - 1], b = LAND[i], u = (e - a[0]) / (b[0] - a[0] || 1);
        return [a[1][0] + (b[1][0] - a[1][0]) * u, a[1][1] + (b[1][1] - a[1][1]) * u, a[1][2] + (b[1][2] - a[1][2]) * u];
      }

  }

  const Basin2DView = {
    el: null, canvas: null, g: null, active: false, inited: false,

    init: function (containerEl) {
      if (this.inited) return;

      cv.className = 'b2d-canvas';
      cv.setAttribute('role', 'img');
      cv.setAttribute('aria-label', 'Two dimensional map of the Ganga basin: river network, surge extent and town hazard classes');
      this.el.appendChild(cv);

      this.relief = null;
      this.v = { x: (px(B.lon0) + px(B.lon1)) / 2, y: (py(B.lat0) + py(B.lat1)) / 2 };
      this.zoom = 1;
      this.W = this.el.clientWidth; this.H = this.el.clientHeight; // safe() needs these

      this.inited = true;

    },

    setActive: function (on) {

    },

    // Own rAF loop, like basinView.js. The local 2D map is driven by app.js's
    // frame loop (which also steps its physics), but the basin map has no
    // physics of its own to share a loop with.
    startLoop: function () {
      if (this.looping) return;
      this.looping = true;
      const self = this;
      function anim() {
        requestAnimationFrame(anim);
        if (self.inited && self.active) self.render();
      }

    },

    data: function () { return root.BasinData; },

    resize: function () {
      if (!this.canvas) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = this.el.clientWidth, h = this.el.clientHeight;
      if (!w || !h) return;
      if (this.canvas.width !== Math.round(w * dpr) || this.canvas.height !== Math.round(h * dpr)) {
        this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
      }
      this.dpr = dpr; this.W = w; this.H = h;
    },

    // Fit to the clear band between the basin view's own side panels, and centre
    // on it, for the same reason as map2d.js: the basin story panel and the
    // attenuation panel are both wide, and the Himalaya head of the network sits
    // exactly where the story panel would cover it.
    safe: function () {
      const W = this.W || (this.el ? this.el.clientWidth : 0), H = this.H || (this.el ? this.el.clientHeight : 0);
      if (W >= 901) {
        const l = panelRight('.basin-story-panel'), r = panelLeft('.basin-intel-panel');
        return { x: l, y: 76, w: Math.max(120, r - l), h: Math.max(120, H - 76 - 88) };
      }
      return { x: 8, y: 64, w: Math.max(120, W - 16), h: Math.max(120, H - 64 - 150) };
    },
    cx: function () { const a = this.safe(); return a.x + a.w / 2; },
    cy: function () { const a = this.safe(); return a.y + a.h / 2; },

    /* Zoom as a multiple of fit, like map2d.js, so the scale is always derived
       from the current clear band rather than a scale cached at init. */
    fitScale: function () { const a = this.safe(); return Math.min(a.w / SPAN_X, a.h / SPAN_Y); },
    scale: function () { return this.fitScale() * this.zoom; },
    // ground span across the clear band at zoom 1, in projected units. Measured
    // rather than assumed to be the basin's full extent, because the fit is
    // whichever of width or height binds.
    unitsAtFit: function () { return this.safe().w / this.fitScale(); },
    clampZoom: function (z) { return clamp(z, this.MIN_ZOOM, this.MAX_ZOOM); },
    fit: function () { this.zoom = 1; this.v.x = (px(B.lon0) + px(B.lon1)) / 2; this.v.y = (py(B.lat0) + py(B.lat1)) / 2; },
    // Same "relative to the view centre" transform as map2d.js. The basin's
    // extent must not enter it, or the whole basin lands off-centre.
    sx: function (lon) { return this.cx() + (px(lon) - this.v.x) * this.scale(); },
    sy: function (lat) { return this.cy() + (py(lat) - this.v.y) * this.scale(); },
    invX: function (p) { return this.v.x + (p - this.cx()) / this.scale(); },
    invY: function (p) { return this.v.y + (p - this.cy()) / this.scale(); },
    invLon: function (p) { return this.invX(p) / KX + B.lon0; },
    invLat: function (p) { return -this.invY(p) + B.lat0; },

    /* Zoom limits, as multiples of fit. The ceiling stops the map magnifying the
       basin DEM (64x64 over 12x10 degrees) past the point where a cell is wider
       than a useful map feature. */
    MIN_ZOOM: 0.8, MAX_ZOOM: 8,

    // spanLon = ground width to frame, in degrees of longitude
    focusLonLat: function (lon, lat, spanLon) {
      this.fly = { fx: this.v.x, fy: this.v.y, fz2: this.zoom, tx: px(lon), ty: py(lat), tz2: this.clampZoom(this.unitsAtFit() / (spanLon * KX)), t0: performance.now(), dur: 520 };
    },

    /* ---- interaction ---- */
    bind: function () {
      const cv = this.canvas;
      let drag = null;
      cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); drag = { x: e.clientX, y: e.clientY, vx: this.v.x, vy: this.v.y, moved: 0 }; this.fly = null; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', e => {
        const r = cv.getBoundingClientRect();
        this.hover = { mx: e.clientX - r.left, my: e.clientY - r.top, lon: this.invLon(e.clientX - r.left), lat: this.invLat(e.clientY - r.top) };
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));

      });
      cv.addEventListener('pointerup', e => { if (drag && drag.moved < 4) this.pick(e); drag = null; });
      cv.addEventListener('pointercancel', () => { drag = null; });
      cv.addEventListener('pointerleave', () => { this.hover = null; });
      cv.addEventListener('wheel', e => {
        e.preventDefault();
        const r = cv.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        const bl = this.invLon(mx), ba = this.invLat(my);

      }, { passive: false });

        const r = cv.getBoundingClientRect();
